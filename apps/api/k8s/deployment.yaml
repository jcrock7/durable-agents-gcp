# The portal: API + web UI in one Deployment (ADR-0013), behind the Ingress (k3d) or the Gateway
# with IAP (GKE). Reads Temporal and LiteLLM (viewer key), and the Kubernetes API for MCP server
# replicas and Postgres health (read-only Role below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api # network policies: reachable from the edge; may reach Temporal and LiteLLM
    spec:
      serviceAccountName: api
      # The API reads deployments, HPAs and the Postgres cluster through the Kubernetes API.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: API_IMAGE # replaced per environment from images.env (see the overlays)
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: LITELLM_BASE_URL
              value: http://litellm:4000
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: LITELLM_VIEWER_KEY
              valueFrom:
                secretKeyRef: { name: litellm-portal-key, key: PORTAL_LITELLM_KEY, optional: true }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Read-only access to what Mission Control shows: deployments and HPAs (MCP servers), and the
# CloudNativePG cluster's status. Nothing else, and nothing writable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-portal-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-reader
subjects:
  - kind: ServiceAccount
    name: api
