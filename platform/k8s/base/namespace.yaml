apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    # Reject any pod that falls short of the restricted profile: non-root, no privilege
    # escalation, all capabilities dropped, RuntimeDefault seccomp. Every platform pod complies.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
