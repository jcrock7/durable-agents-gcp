# One Kubernetes service account per workload. On GKE, the overlay annotates each one with
# its Google service account (Workload Identity); the Terraform cluster layer grants the binding.
# None of these workloads call the Kubernetes API, so token automounting is off.
#
# The CloudNativePG cluster "agents-pg" creates its own service account; its Workload Identity
# annotation is set in the Postgres Cluster manifest (platform/services/postgres).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
automountServiceAccountToken: false
