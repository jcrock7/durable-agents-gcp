# Lets the portal API delete worker pods for the Live Run "Kill worker" demo. Pods only; the
# API's portal-reader Role stays read-only. Bound only where this component is included.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-worker-killer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-demo-worker-killer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-worker-killer
subjects:
  - kind: ServiceAccount
    name: api
