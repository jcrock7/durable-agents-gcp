# Workload Identity: each Kubernetes service account acts as its Google service account.
# Values are replaced from cluster.env (foundation Terraform outputs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: API_GSA
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: WORKER_GSA
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  annotations:
    iam.gke.io/gcp-service-account: LITELLM_GSA
