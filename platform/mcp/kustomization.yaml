# In-cluster MCP servers (ADR-0020), one Deployment, Service and ServiceAccount each.
#   erp-read    MCP Toolbox for Databases, Postgres role erp_reader
#   erp-write   MCP Toolbox for Databases, Postgres role erp_writer (workflow-only tools)
#   docs        custom (apps/mcp-docs): the synthetic document store, read-only
# Requires the erp database and the Secrets pg-erp-reader and pg-erp-writer, which the apply
# scripts create; see platform/mcp/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - erp-read
  - erp-write
  - docs
  - networkpolicies.yaml
