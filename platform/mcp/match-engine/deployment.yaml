# match-engine: deterministic three-way match, duplicate check and adjustment arithmetic
# (apps/mcp-match-engine). Stateless and CPU-bound, so it scales on CPU with a standard
# HorizontalPodAutoscaler: 1 replica idle, up to 10 when a queue fans out. No credentials: it
# reads ERP data through erp-read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-match-engine
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-match-engine
  labels:
    app.kubernetes.io/name: mcp-match-engine
    app.kubernetes.io/component: mcp-server
spec:
  # No "replicas": the HPA owns the count, and re-applying this file must not reset it.
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-match-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-match-engine
        app.kubernetes.io/component: mcp-server # network policies: reachable from the worker only
    spec:
      serviceAccountName: mcp-match-engine
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" in the base image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: match-engine
          image: MCP_MATCH_ENGINE_IMAGE # replaced per environment from images.env (see the overlays)
          env:
            - name: MCP_ERP_READ_URL
              value: http://mcp-erp-read:8080/mcp
            - name: ALLOWED_HOSTS
              value: mcp-match-engine,mcp-match-engine.agents,mcp-match-engine.agents.svc,mcp-match-engine.agents.svc.cluster.local,localhost
            # Default tolerance (example values; the agent passes its own policy per call).
            - name: TOLERANCE_PRICE_PCT
              value: "2"
            - name: TOLERANCE_PRICE_CENTS
              value: "5000"
            - name: TOLERANCE_QUANTITY
              value: "0"
          ports:
            - name: mcp
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
          # The HPA scales on CPU as a share of this request, so the request is the scaling knob.
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-match-engine
  labels:
    app.kubernetes.io/name: mcp-match-engine
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    app.kubernetes.io/name: mcp-match-engine
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
---
# Scale on average CPU across replicas: add pods above 60% of the request, up to 10.
# Scale-down waits 2 minutes of low load, so a bursty queue doesn't flap.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-match-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-match-engine
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
