# One Postgres 17 instance managed by CloudNativePG.
#   database "app"     owner app      (agents, results, pgvector embeddings)
#   database "litellm" owner litellm  (gateway keys, budgets, spend logs)
#   database "erp"     owner erp_owner (synthetic ERP for the Invoice Exception Resolver; read by
#                      MCP server erp-read as erp_reader, written by erp-write as erp_writer)
# Services created by the operator: agents-pg-rw (read/write), agents-pg-r, agents-pg-ro.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agents-pg
spec:
  instances: 1
  # Official CloudNativePG image, "system" variant: pgvector plus the Barman Cloud tools that the
  # GKE overlay's backups call (postgres-gke.yaml). The "standard" variant has pgvector but no
  # Barman, so backups and WAL archiving fail on it with "barman-cloud-...: executable file not
  # found". Go back to "standard" only together with the move to the Barman Cloud plugin.
  imageName: ghcr.io/cloudnative-pg/postgresql:17-system-bookworm@sha256:7bfe2e96f4592b1dcfa8669810f571192b860b99732ba552e8abd34824af5927

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: pg-app # kubernetes.io/basic-auth, username "app"
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  managed:
    roles:
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: pg-litellm # kubernetes.io/basic-auth, username "litellm"
      # Synthetic ERP (agents/general/invoice-exception-resolver/data). Grants are in its seed SQL.
      - name: erp_owner
        ensure: present
        login: false
      - name: erp_reader
        ensure: present
        login: true
        passwordSecret:
          name: pg-erp-reader # kubernetes.io/basic-auth, username "erp_reader"
      - name: erp_writer
        ensure: present
        login: true
        passwordSecret:
          name: pg-erp-writer # kubernetes.io/basic-auth, username "erp_writer"
      # Demo controls only (platform/k8s/components/demo-controls): the portal API resets the sample
      # invoice as this role. Nothing connects as it unless DEMO_CONTROLS is on.
      - name: erp_demo
        ensure: present
        login: true
        passwordSecret:
          name: pg-erp-demo # kubernetes.io/basic-auth, username "erp_demo"
