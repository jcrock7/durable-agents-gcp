# CloudNativePG operator (cluster-wide, namespace cnpg-system). Installed before anything that uses
# its custom resources (Cluster, Database, Backup), by scripts/local/apply-k8s.sh and scripts/gke/apply-k8s.sh.
# Pinned release; review the release notes before bumping.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
