# Temporal CLI dev server: frontend gRPC on 7233, Web UI on 8233, history in SQLite on /data.
# Runs on on-demand capacity (no Spot selector): losing it pauses every agent run.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  serviceName: temporal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "temporal" user in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: temporalio/temporal:1.10.0@sha256:003508da05989e7cf0d583cfce521c4bb2732e733574e3040db8f1284783baa2
          args:
            - server
            - start-dev
            - --ip=0.0.0.0
            - --port=7233
            - --ui-port=8233
            - --db-filename=/data/temporal.db
            - --log-level=warn
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
